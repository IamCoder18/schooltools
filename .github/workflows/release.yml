name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-arm
            goos: linux
            goarch: arm
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Verify
        run: |
          go mod download
          go mod verify
          go vet ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          out="dist/schooltools-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w" \
            -o "${out}" .
          (cd dist && sha256sum "$(basename "${out}")" > "$(basename "${out}").sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: schooltools-${{ matrix.target }}
          path: |
            dist/schooltools-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext }}
            dist/schooltools-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate combined SHA256SUMS
        working-directory: dist
        run: |
          { echo "# schooltools ${{ github.ref_name }}"; sha256sum -b schooltools-*; } > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
